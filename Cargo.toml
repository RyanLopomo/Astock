[workspace]
members = ["crates/axis-estoque-core", "src-tauri"]
default-members = ["crates/axis-estoque-core"]
resolver = "2"

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "LicenseRef-Proprietary"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "=0.41.1", features = ["bundled", "backup"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
