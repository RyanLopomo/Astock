[package]
name = "axis-estoque-desktop"
default-run = "astock"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "astock"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde.workspace = true
serde_json = "=1.0.154"
axis-estoque-core = { path = "../crates/axis-estoque-core" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
webview2-com = "=0.39.1"
windows = { version = "=0.62.2", features = ["Win32_System_Com"] }
